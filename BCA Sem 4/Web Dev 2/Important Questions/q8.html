<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    form {
      background: #333;
      padding: 1.5rem;
      border-radius: 8px;
      width: 300px;
    }

    input, button {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border-radius: 5px;
      border: 1px solid #444;
    }

    button {
      background-color: #1f6feb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #1a5ec8;
    }

    .error {
      color: red;
      font-size: 0.9rem;
      margin-top: -10px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <form id="loginForm" onsubmit="return validateForm()">
    <h2>Login</h2>

    <input type="email" id="email" placeholder="Enter your email" required>
    <div id="emailError" class="error"></div>

    <input type="password" id="password" placeholder="Enter your password" required>
    <div id="passwordError" class="error"></div>

    <button type="submit">Submit</button>
  </form>

  <script>
    function validateForm() {
      // Clear previous error messages
      document.getElementById("emailError").textContent = "";
      document.getElementById("passwordError").textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      let valid = true;

      // Email validation: must end with @sushantuniversity.edu.in
      const emailRegex = /^[a-zA-Z0-9._%+-]+@sushantuniversity\.edu\.in$/;
      if (!emailRegex.test(email)) {
        document.getElementById("emailError").textContent = "Please enter a valid email ending with @sushantuniversity.edu.in!";
        valid = false;
      }

      // Password validation: must be at least 8 characters, with uppercase, lowercase, number, and special character
      const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*])[A-Za-z\d!@#$%^&*]{8,}$/;
      if (!passwordRegex.test(password)) {
        document.getElementById("passwordError").textContent = "Password must be at least 8 characters, include an uppercase letter, lowercase letter, number, and special character!";
        valid = false;
      }

      return valid;  // If false, form submission will be stopped
    }
  </script>

</body>
</html>
